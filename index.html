<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2 Emulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #emulator {
            width: 100%;
            height: 100%;
            display: none;
        }
        #start-btn {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #0064ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
        }
        #start-btn:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>

    <button id="start-btn" onclick="startGame()">Start Game</button>
    <div id="emulator"></div>

    <script>
        function startGame() {
    try {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('emulator').style.display = 'block';

        window.EJS_player = '#emulator';
        window.EJS_core = 'segaMD'; 
        window.EJS_gameName = "Sonic the Hedgehog 2";
        window.EJS_color = '#0064ff';
        window.EJS_startOnLoaded = true; 
        window.EJS_gameUrl = 'sonic2.bin'; 
        
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@latest/data/';

        let script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@latest/data/loader.js";
        
        script.onerror = function() {
            alert("Erro de conexão. Certifique-se de estar rodando em um servidor local (HTTP) e com o AdBlock desativado.");
        };
        
        document.body.appendChild(script);
    } catch (error) {
        alert("An error occurred: " + error.message);
    }
}
    </script>

</body>
</html>
