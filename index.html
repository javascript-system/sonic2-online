<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2 Emulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #emulator {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="emulator"></div>

    <script>
        window.EJS_player = '#emulator';
        window.EJS_core = 'segaMD'; 
        window.EJS_gameName = "Sonic the Hedgehog 2";
        window.EJS_color = '#0064ff';
        window.EJS_startOnLoaded = true;
        
        // Garante o endereço correto do arquivo no Render
        window.EJS_gameUrl = window.location.origin + '/sonic2.bin'; 

        // CDN com alta disponibilidade para carregar os motores
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@latest/data/';
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@latest/data/loader.js"></script>

</body>
</html>
