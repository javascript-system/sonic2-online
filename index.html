<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2 Emulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #emulator {
            width: 100%;
            height: 100%;
            display: none;
        }
        #start-btn {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #0064ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
        }
        #start-btn:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>

    <button id="start-btn" onclick="startGame()">Start Game</button>
    <div id="emulator"></div>

    <script>
        function startGame() {
    try {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('emulator').style.display = 'block';

        EJS_player = '#emulator';
        EJS_core = 'segaMD'; 
        EJS_gameName = "Sonic the Hedgehog 2";
        EJS_color = '#0064ff';
        EJS_startOnLoaded = true; 
        EJS_gameUrl = 'sonic2.bin'; 
        
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        let script = document.createElement('script');
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        
        script.onerror = function() {
            alert("Error: Failed to load the emulator scripts. Check your internet connection.");
        };
        
        document.body.appendChild(script);
    } catch (error) {
        alert("An error occurred: " + error.message);
    }
}
    </script>

</body>
</html>
